woonkamer_northern_lights_theme:
  alias: Woonkamer - Northern Lights kleurenthema
  mode: restart
  sequence:
    # Basislampen gewoon aan
    - action: light.turn_on
      target:
        entity_id:
          - light.woonkamer_plafond
          - light.vloerlamp

    - repeat:
        while:
          - condition: template
            value_template: "{{ true }}"
        sequence:
          # Teal / Violet / Deep blue
          - action: light.turn_on
            target:
              entity_id: light.kast
            data:
              brightness_pct: 70
              rgb_color: [0, 190, 160]
              transition: 20

          - action: light.turn_on
            target:
              entity_id: light.woonkamer_led
            data:
              brightness_pct: 45
              rgb_color: [140, 45, 255]
              transition: 45

          - action: light.turn_on
            target:
              entity_id: light.woonkamer_dressoir
            data:
              brightness_pct: 65
              rgb_color: [35, 100, 255]
              transition: 20

          - delay: "00:01:00"

          # Deep blue / Emerald / Violet
          - action: light.turn_on
            target:
              entity_id: light.kast
            data:
              brightness_pct: 70
              rgb_color: [35, 100, 255]
              transition: 20

          - action: light.turn_on
            target:
              entity_id: light.woonkamer_led
            data:
              brightness_pct: 45
              rgb_color: [0, 190, 160]
              transition: 45

          - action: light.turn_on
            target:
              entity_id: light.woonkamer_dressoir
            data:
              brightness_pct: 65
              rgb_color: [150, 45, 255]
              transition: 20

          - delay: "00:01:00"

          # Violet / Aurora green / Teal-blue
          - action: light.turn_on
            target:
              entity_id: light.kast
            data:
              brightness_pct: 70
              rgb_color: [150, 45, 255]
              transition: 20

          - action: light.turn_on
            target:
              entity_id: light.woonkamer_led
            data:
              brightness_pct: 45
              rgb_color: [0, 220, 120]
              transition: 45

          - action: light.turn_on
            target:
              entity_id: light.woonkamer_dressoir
            data:
              brightness_pct: 65
              rgb_color: [0, 170, 220]
              transition: 20

          - delay: "00:01:00"