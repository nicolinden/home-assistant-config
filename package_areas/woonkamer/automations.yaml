- id: homepod_push_woonkamer_pulse_5min
  alias: "HomePod push - Woonkamer (pulse elke 5 min)"
  description: "Puls de HomePod trigger-switch zodat HomeKit automation kan draaien"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition: []
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.homepod_push_woonkamer

    - delay: "00:00:01"

    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.homepod_push_woonkamer

- alias: Woonkamer - HDMI dropdown gewijzigd
  id: woonkamer_tv_hdmi_dropdown_gewijzigd
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.woonkamer_tv_channel
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Apple TV' }}"
          sequence:
            - service: media_player.select_source
              target:
                entity_id: media_player.55oled705_12
              data:
                source: "HDMI 3"

        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Nintendo' }}"
          sequence:
            - service: media_player.select_source
              target:
                entity_id: media_player.55oled705_12
              data:
                source: "HDMI 1"

        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Ziggo' }}"
          sequence:
            - service: media_player.select_source
              target:
                entity_id: media_player.55oled705_12
              data:
                source: "HDMI 4"

        - conditions:
            - condition: template
              value_template: "{{ trigger.to_state.state == 'Sonos' }}"
          sequence:
            - service: media_player.select_source
              target:
                entity_id: media_player.55oled705_12
              data:
                source: "HDMI 2"

- alias: Woonkamer - Apple TV app geselecteerd
  id: woonkamer_appletv_app_geselecteerd
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.woonkamer_appletv_app
  condition:
    - condition: state
      entity_id: input_select.woonkamer_tv_channel
      state: "Apple TV"
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['unknown', 'unavailable', 'none'] }}
  action:
    - service: media_player.select_source
      target:
        entity_id: media_player.woonkamer_tv
      data:
        source: "{{ trigger.to_state.state }}"