- id: homepod_push_kantoor_pulse_5min
  alias: "HomePod push - Kantoor (pulse elke 5 min)"
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition: []
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.homepod_push_kantoor
    - delay: "00:00:01"
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.homepod_push_kantoor

- alias: Kantoor - camera volgt workmode
  id: kantoor_camera_volgt_workmode
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.kantoor_work_mode
      to: "on"
    - trigger: state
      entity_id: input_boolean.kantoor_work_mode
      to: "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.kantoor_work_mode
              state: "on"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.kantoor_camera

        - conditions:
            - condition: state
              entity_id: input_boolean.kantoor_work_mode
              state: "off"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.kantoor_camera
            - action: script.macbook_sleep

- alias: Kantoor - deur open zet juiste mode
  id: kantoor_door_open_zet_juiste_mode
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.kantoor_door
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.kantoor_work_mode
      state: "off"
  actions:
    - choose:
        - conditions:
            - condition: time
              after: "07:30:00"
              before: "19:01:00"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.kantoor_kleur_werk_sfeer

            - action: light.turn_on
              target:
                entity_id: light.kantoor_plafond
              data:
                brightness_pct: 80

            - action: light.turn_on
              target:
                entity_id:
                  - light.shapes_11a9
                  - light.hue_smart_plug
                  - light.tuya_ledstrip
              data:
                effect: "Neon Tokyo"

        - conditions:
            - condition: or
              conditions:
                - condition: time
                  after: "19:01:00"
                - condition: time
                  before: "07:30:00"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.kantoor_nachtlampje

            - action: light.turn_off
              target:
                entity_id: light.shapes_11a9

- alias: Kantoor - deur dicht en geen workmode is alles uit
  id: kantoor_door_dicht_geen_workmode_alles_uit
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.kantoor_door
      to: "off"

  actions:
    - condition: state
      entity_id: input_boolean.kantoor_work_mode
      state: "off"

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.kantoor_manual_presence

    - delay: "00:02:00"

    - condition: state
      entity_id: binary_sensor.kantoor_door
      state: "off"

    - condition: state
      entity_id: input_boolean.kantoor_work_mode
      state: "off"

    - if:
        - condition: state
          entity_id: binary_sensor.tuya_motion_sensor_2
          state: "on"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.kantoor_manual_presence

    - delay: "00:01:00"

    - condition: state
      entity_id: binary_sensor.kantoor_door
      state: "off"

    - condition: state
      entity_id: input_boolean.kantoor_work_mode
      state: "off"

    - condition: state
      entity_id: input_boolean.kantoor_manual_presence
      state: "off"

    - variables:
        kantoor_lights: >-
          {{
            area_entities('Kantoor')
            | select('match', '^light\.')
            | list
          }}
        excluded_lights: >-
          {{
            label_entities('dontCountAsLight')
            | select('match', '^light\.')
            | list
          }}
        lights_to_turn_off: >-
          {{
            kantoor_lights
            | reject('in', excluded_lights)
            | list
          }}

    - if:
        - condition: template
          value_template: "{{ lights_to_turn_off | count > 0 }}"
      then:
        - action: light.turn_off
          target:
            entity_id: "{{ lights_to_turn_off }}"

    - action: media_player.media_pause
      target:
        entity_id: media_player.kantoor_homepods

    - action: light.turn_off
      target:
        entity_id:
          - light.shapes_11a9
          - light.hue_smart_plug
          - light.tuya_ledstrip

    - delay: "00:00:05"

    - action: script.macbook_sleep

- alias: Kantoor - beweging annuleert deur dicht uitschakelen
  id: kantoor_motion_annuleert_deur_dicht_uitschakelen
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.tuya_motion_sensor_2
      to: "on"

  conditions:
    - condition: state
      entity_id: binary_sensor.kantoor_door
      state: "off"

    - condition: state
      entity_id: input_boolean.kantoor_work_mode
      state: "off"

  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kantoor_manual_presence