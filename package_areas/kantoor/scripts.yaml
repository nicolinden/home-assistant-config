kantoor_toggle_dynamic_theme:
  alias: Kantoor - Toggle dynamic theme
  icon: mdi:palette
  mode: restart
  sequence:
    - if:
        - condition: state
          entity_id: script.kantoor_dynamic_theme
          state: "on"
      then:
        - action: script.turn_off
          target:
            entity_id: script.kantoor_dynamic_theme
      else:
        - action: script.turn_on
          target:
            entity_id: script.kantoor_dynamic_theme