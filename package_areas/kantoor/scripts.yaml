macbook_sleep:
  alias: Zet MacBook in slaap
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.macbook_sleep_in_progress

    - action: shell_command.macbook_sleep

    - delay: "00:02:00"

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.macbook_sleep_in_progress

kantoor_mode_work:
  alias: Kantoor mode - Work
  icon: mdi:briefcase
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kantoor_work_mode

    - action: scene.turn_on
      target:
        entity_id: scene.kantoor_kantoor_sfeer

    - action: script.turn_on
      target:
        entity_id: script.kantoor_dynamic_theme

    - action: media_player.media_play
      target:
        entity_id: media_player.kantoor_2

    - action: light.turn_on
      target:
        entity_id: light.shapes_11a9
      data:
        effect: "Neon Tokyo"

kantoor_mode_teamscall:
  alias: Kantoor mode - Teamscall
  icon: mdi:video
  mode: restart
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kantoor_work_mode

    - action: scene.turn_on
      target:
        entity_id: scene.kantoor_kantoor_sfeer

    - action: script.turn_on
      target:
        entity_id: script.kantoor_dynamic_theme

    - action: media_player.media_pause
      target:
        entity_id: media_player.kantoor_2

    - action: light.turn_on
      target:
        entity_id: light.shapes_11a9
      data:
        effect: "Teams"

kantoor_mode_night:
  alias: Kantoor mode - Night
  icon: mdi:weather-night
  mode: restart
  sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.kantoor_work_mode

    - action: script.turn_off
      target:
        entity_id: script.kantoor_dynamic_theme

    - action: scene.turn_on
      target:
        entity_id: scene.kantoor_nachtlampje

    - action: media_player.media_pause
      target:
        entity_id: media_player.kantoor_2

    - action: light.turn_off
      target:
        entity_id:
          - light.shapes_11a9
          - light.tuya_ledstrip
          - light.kantoor_bloom

kantoor_toggle_media:
  alias: Kantoor - Toggle media
  icon: mdi:play-pause
  mode: restart
  sequence:
    - if:
        - condition: state
          entity_id: media_player.kantoor_2
          state: "playing"
      then:
        - action: media_player.media_pause
          target:
            entity_id: media_player.kantoor_2
      else:
        - action: media_player.media_play
          target:
            entity_id: media_player.kantoor_2

kantoor_toggle_work_mode:
  alias: Kantoor - Toggle work mode
  icon: mdi:toggle-switch
  mode: restart
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.kantoor_work_mode
          state: "on"
      then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.kantoor_work_mode

        - action: script.turn_off
          target:
            entity_id: script.kantoor_dynamic_theme
      else:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.kantoor_work_mode

        - action: script.turn_on
          target:
            entity_id: script.kantoor_dynamic_theme

kantoor_dynamic_theme:
  alias: Kantoor - Dynamisch kleurenthema
  mode: restart
  sequence:
    - repeat:
        while:
          - condition: template
            value_template: "{{ true }}"
        sequence:
          # Ronde 1
          - action: light.turn_on
            target:
              entity_id: light.kantoor_bloom
            data:
              brightness_pct: 100
              rgb_color: [0, 190, 160] # teal
              transition: 75

          - action: light.turn_on
            target:
              entity_id: light.tuya_ledstrip
            data:
              brightness_pct: 45
              rgb_color: [35, 100, 255] # blauw
              transition: 75

          - action: light.turn_on
            target:
              entity_id: light.kast_ledstrip_02
            data:
              brightness_pct: 45
              rgb_color: [145, 45, 255] # violet
              transition: 75

          - action: light.turn_on
            target:
              entity_id: light.light_kast_ledstrip_03
            data:
              brightness_pct: 45
              rgb_color: [255, 40, 150] # magenta
              transition: 75

          - delay: "00:01:15"

          # Ronde 2 - kleuren schuiven door
          - action: light.turn_on
            target:
              entity_id: light.kantoor_bloom
