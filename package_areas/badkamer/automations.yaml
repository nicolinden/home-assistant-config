- id: badkamer_douche_start
  alias: Badkamer - Douche start detectie
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.badkamer_humidity_stijgt
      to: "on"
      for: "00:02:00"

  condition:
    - condition: state
      entity_id: input_boolean.badkamer_douchen
      state: "off"
    - condition: state
      entity_id: binary_sensor.badkamer_lights_on
      state: "on"

  action:
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.badkamer_water_lijkt_op_douche
          to: "on"
          for: "00:01:00"
      timeout: "00:10:00"
      continue_on_timeout: false

    - condition: state
      entity_id: binary_sensor.badkamer_lights_on
      state: "on"

    - condition: state
      entity_id: binary_sensor.badkamer_humidity_stijgt
      state: "on"

    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.badkamer_douchen

    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.badkamer_douche_starttijd
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    - service: input_number.set_value
      target:
        entity_id: input_number.badkamer_douche_start_water
      data:
        value: "{{ states('sensor.watermeter_total_water_usage') | float(0) }}"

    - service: timer.start
      target:
        entity_id: timer.badkamer_douche
      data:
        duration: "00:45:00"

    - service: notify.mobile_app_iphone_15_pro_max
      data:
        title: Douche gestart
        message: >
          Douche detectie actief.


- id: badkamer_douche_stop
  alias: Badkamer - Douche stop detectie
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.badkamer_water_lijkt_op_douche
      to: "off"
      for: "00:00:30"
      id: water_off

    - platform: state
      entity_id: binary_sensor.badkamer_lights_on
      to: "off"
      for: "00:01:00"
      id: lights_off

    - platform: state
      entity_id: binary_sensor.badkamer_humidity_daalt
      to: "on"
      for: "00:03:00"
      id: humidity_falling

    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.badkamer_douche
      id: failsafe_timer

  condition:
    - condition: state
      entity_id: input_boolean.badkamer_douchen
      state: "on"

  action:
    - choose:
        - conditions:
            - condition: trigger
              id: water_off
          sequence:
            - variables:
                douche_duur: "{{ states('sensor.badkamer_douche_duur_echt_weergave') }}"
                water_verbruik: "{{ states('sensor.badkamer_douche_waterverbruik') }}"
            - service: notify.mobile_app_iphone_15_pro_max
              data:
                title: Douche klaar
                message: >
                  Douche duur: {{ douche_duur }} · Waterverbruik: {{ water_verbruik }} L
            - service: script.badkamer_douche_reset

        - conditions:
            - condition: trigger
              id: lights_off
            - condition: state
              entity_id: binary_sensor.badkamer_water_lijkt_op_douche
              state: "off"
          sequence:
            - variables:
                douche_duur: "{{ states('sensor.badkamer_douche_duur_echt_weergave') }}"
                water_verbruik: "{{ states('sensor.badkamer_douche_waterverbruik') }}"
            - service: notify.mobile_app_iphone_15_pro_max
              data:
                title: Douche klaar
                message: >
                  Douche duur: {{ douche_duur }} · Waterverbruik: {{ water_verbruik }} L
            - service: script.badkamer_douche_reset

        - conditions:
            - condition: trigger
              id: humidity_falling
            - condition: state
              entity_id: binary_sensor.badkamer_water_lijkt_op_douche
              state: "off"
          sequence:
            - variables:
                douche_duur: "{{ states('sensor.badkamer_douche_duur_echt_weergave') }}"
                water_verbruik: "{{ states('sensor.badkamer_douche_waterverbruik') }}"
            - service: notify.mobile_app_iphone_15_pro_max
              data:
                title: Douche klaar
                message: >
                  Douche duur: {{ douche_duur }} · Waterverbruik: {{ water_verbruik }} L
            - service: script.badkamer_douche_reset

        - conditions:
            - condition: trigger
              id: failsafe_timer
          sequence:
            - variables:
                douche_duur: "{{ states('sensor.badkamer_douche_duur_echt_weergave') }}"
                water_verbruik: "{{ states('sensor.badkamer_douche_waterverbruik') }}"
            - service: notify.mobile_app_iphone_15_pro_max
              data:
                title: Douche gestopt via failsafe
                message: >
                  Douche duur: {{ douche_duur }} · Waterverbruik: {{ water_verbruik }} L
            - service: script.badkamer_douche_reset